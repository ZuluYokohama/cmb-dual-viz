name: materialize-sync-payloads
on:
  push:
    branches: [main]
    paths:
      - 'sync-payloads/**'
      - '.github/workflows/materialize-sync-payloads.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zlib.b64 payloads into src
        run: |
          python3 << 'PY'
          import base64, zlib, pathlib, subprocess, sys, json
          root = pathlib.Path('.')

          def load_text(stem: str):
            parts = sorted(root.glob(f'sync-payloads/{stem}.part*'))
            if parts:
              text = ''.join(p.read_text() for p in parts)
              print(stem, 'from', len(parts), 'parts', 'chars', len(text))
              return text
            sp = root / f'sync-payloads/{stem}'
            if sp.exists():
              text = sp.read_text()
              print(stem, 'from single file chars', len(text))
              return text
            return None

          def load_b64(stem: str):
            parts = sorted(root.glob(f'sync-payloads/{stem}.zlib.b64.part*'))
            if parts:
              text = ''.join(p.read_text().strip() for p in parts)
              print(stem, 'from', len(parts), 'b64 parts', 'chars', len(text))
              return text
            sp = root / f'sync-payloads/{stem}.zlib.b64'
            if sp.exists():
              text = sp.read_text().strip()
              print(stem, 'from single b64 chars', len(text))
              return text
            print('skip missing payload', stem)
            return None

          man_text = load_text('manifest.json')
          if man_text is None:
            print('no manifest; nothing to do')
            sys.exit(0)
          manifest = json.loads(man_text)

          changed = False
          for item in manifest['entries']:
            stem = item['payload']
            dst = item['dest']
            want = item['sha']
            text = load_b64(stem)
            if text is None:
              continue
            raw = zlib.decompress(base64.b64decode(text))
            h = subprocess.check_output(['git','hash-object','--stdin'], input=raw).decode().strip()
            print(dst, 'git', h, 'want', want, 'ok', h==want)
            if h != want:
              sys.exit(f'hash mismatch for {dst}')
            dp = root / dst
            if (not dp.exists()) or dp.read_bytes() != raw:
              dp.parent.mkdir(parents=True, exist_ok=True)
              dp.write_bytes(raw)
              changed = True
              print('wrote', dst, 'bytes', len(raw))
            else:
              print('unchanged', dst)
          print('changed', changed)
          PY
      - name: Commit materialized sources
        run: |
          git config user.name "Zulu Operations"
          git config user.email "zuluyokahama@gmail.com"
          git add -A src
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: materialize src from verified zlib.b64 payloads"
            git push
          fi
